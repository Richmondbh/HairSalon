<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a2340"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f86"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#fbf8f5"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#4a2340">Nordic Hair Studio - full-stack architecture</text>
  <text x="30" y="62" font-size="13" fill="#6d6469">Blazor WebAssembly client  →  HTTPS + JSON + JWT  →  ASP.NET Core Web API  →  EF Core  →  SQLite</text>

  <!-- ================= CLIENT ================= -->
  <rect x="30" y="85" width="400" height="520" rx="16" fill="#f6eef3" stroke="#4a2340" stroke-width="1.5"/>
  <text x="50" y="112" font-size="15" font-weight="700" fill="#4a2340">HairSalon.Client</text>
  <text x="50" y="130" font-size="11.5" fill="#6d6469">Blazor WebAssembly - runs in the browser (port 7100)</text>

  <rect x="55" y="145" width="350" height="70" rx="10" fill="#fff" stroke="#c9a24b"/>
  <text x="70" y="168" font-size="13" font-weight="700" fill="#2b2228">1. Pages  (Pages/*.razor, Pages/Admin/*.razor)</text>
  <text x="70" y="187" font-size="11" fill="#555">Home, Services, Stylists, Book, MyAppointments, Profile,</text>
  <text x="70" y="203" font-size="11" fill="#555">Admin pages: Dashboard, Appointments, Customers, Reports ...</text>

  <rect x="55" y="230" width="350" height="70" rx="10" fill="#fff" stroke="#c9a24b"/>
  <text x="70" y="253" font-size="13" font-weight="700" fill="#2b2228">2. Reusable components  (Components/)</text>
  <text x="70" y="272" font-size="11" fill="#555">ServiceCard, SearchBox, TimeSlotPicker, AppointmentCard,</text>
  <text x="70" y="288" font-size="11" fill="#555">Modal, StarRating, BarChart ...  + State/ (shared state)</text>

  <rect x="55" y="315" width="350" height="70" rx="10" fill="#fff" stroke="#c9a24b"/>
  <text x="70" y="338" font-size="13" font-weight="700" fill="#2b2228">3. Application services  (Services/*ApiClient)</text>
  <text x="70" y="357" font-size="11" fill="#555">ServiceApiClient, AppointmentApiClient, ... : ApiClientBase</text>
  <text x="70" y="373" font-size="11" fill="#555">build URLs, send JSON, turn errors into ApiException</text>

  <rect x="55" y="400" width="350" height="70" rx="10" fill="#fff" stroke="#c9a24b"/>
  <text x="70" y="423" font-size="13" font-weight="700" fill="#2b2228">4. HttpClient + AuthHeaderHandler  (Auth/)</text>
  <text x="70" y="442" font-size="11" fill="#555">adds "Authorization: Bearer &lt;JWT&gt;" to every request;</text>
  <text x="70" y="458" font-size="11" fill="#555">JwtAuthenticationStateProvider tells Blazor who is logged in</text>

  <rect x="55" y="485" width="350" height="45" rx="10" fill="#fff" stroke="#d6c7cf" stroke-dasharray="4 3"/>
  <text x="70" y="512" font-size="11.5" fill="#555">Browser localStorage: the JWT (kept between page loads)</text>

  <line x1="230" y1="215" x2="230" y2="228" stroke="#4a2340" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="300" x2="230" y2="313" stroke="#4a2340" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="385" x2="230" y2="398" stroke="#4a2340" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="470" x2="230" y2="483" stroke="#8a7f86" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

  <!-- ================= HTTP ================= -->
  <line x1="405" y1="435" x2="525" y2="435" stroke="#4a2340" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="525" y1="455" x2="405" y2="455" stroke="#8a7f86" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <text x="418" y="425" font-size="11" font-weight="700" fill="#4a2340">HTTPS request</text>
  <text x="418" y="472" font-size="11" fill="#6d6469">JSON response</text>
  <text x="418" y="488" font-size="10" fill="#6d6469">(DTOs from Shared)</text>

  <!-- ================= API ================= -->
  <rect x="530" y="85" width="400" height="520" rx="16" fill="#eef6f5" stroke="#2f8f83" stroke-width="1.5"/>
  <text x="550" y="112" font-size="15" font-weight="700" fill="#1d6158">HairSalon.Api</text>
  <text x="550" y="130" font-size="11.5" fill="#6d6469">ASP.NET Core Web API (port 7200)</text>

  <rect x="555" y="400" width="350" height="70" rx="10" fill="#fff" stroke="#2f8f83"/>
  <text x="570" y="423" font-size="13" font-weight="700" fill="#2b2228">5. Middleware pipeline  (Program.cs)</text>
  <text x="570" y="442" font-size="11" fill="#555">ExceptionHandler → CORS → Authentication (JWT)</text>
  <text x="570" y="458" font-size="11" fill="#555">→ Authorization ([Authorize(Roles = "Admin")])</text>

  <rect x="555" y="315" width="350" height="70" rx="10" fill="#fff" stroke="#2f8f83"/>
  <text x="570" y="338" font-size="13" font-weight="700" fill="#2b2228">6. Web API layer  (Controllers/)</text>
  <text x="570" y="357" font-size="11" fill="#555">thin controllers: read the request, call a service,</text>
  <text x="570" y="373" font-size="11" fill="#555">return Ok/Created/NoContent. [ApiController] validates DTOs</text>

  <rect x="555" y="230" width="350" height="70" rx="10" fill="#fff" stroke="#2f8f83"/>
  <text x="570" y="253" font-size="13" font-weight="700" fill="#2b2228">7. Business logic layer  (Services/)</text>
  <text x="570" y="272" font-size="11" fill="#555">AppointmentService, DashboardService, LoyaltyService ...</text>
  <text x="570" y="288" font-size="11" fill="#555">business rules + LINQ queries; throws custom exceptions</text>

  <rect x="555" y="145" width="350" height="70" rx="10" fill="#fff" stroke="#2f8f83"/>
  <text x="570" y="168" font-size="13" font-weight="700" fill="#2b2228">8. Data access layer  (Data/, Models/)</text>
  <text x="570" y="187" font-size="11" fill="#555">SalonDbContext : IdentityDbContext  +  entities</text>
  <text x="570" y="203" font-size="11" fill="#555">Entity Framework Core, migrations, DbSeeder</text>

  <rect x="555" y="485" width="350" height="45" rx="10" fill="#fff" stroke="#d6c7cf" stroke-dasharray="4 3"/>
  <text x="570" y="512" font-size="11.5" fill="#555">AppointmentReminderService (background, every 5 min)</text>

  <line x1="730" y1="400" x2="730" y2="387" stroke="#1d6158" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="315" x2="730" y2="302" stroke="#1d6158" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="230" x2="730" y2="217" stroke="#1d6158" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLite box -->
  <rect x="555" y="545" width="350" height="45" rx="22" fill="#2f8f83"/>
  <text x="730" y="573" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SQLite database  (salon.db)</text>
  <path d="M905,180 C935,180 935,567 907,567" fill="none" stroke="#1d6158" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="918" y="380" font-size="10.5" fill="#1d6158" transform="rotate(90 918 380)">SQL via EF Core</text>

  <!-- ================= SHARED ================= -->
  <rect x="230" y="625" width="500" height="58" rx="12" fill="#fbf1da" stroke="#c9a24b" stroke-width="1.5"/>
  <text x="480" y="648" font-size="14" font-weight="700" fill="#7a5c14" text-anchor="middle">HairSalon.Shared  (class library used by BOTH projects)</text>
  <text x="480" y="668" font-size="11.5" fill="#6d6469" text-anchor="middle">DTOs + validation attributes, enums, Roles, SalonHours, LoyaltyRules, SalonJson</text>
  <line x1="230" y1="605" x2="300" y2="623" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="730" y1="605" x2="660" y2="623" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
